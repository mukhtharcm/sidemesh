name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Test server
        run: npm run test:server

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  mobile:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Check theme ownership
        run: python3 scripts/check_flutter_theme.py

      - name: Check macOS keychain storage and profile validation
        run: |
          python3 scripts/test_macos_keychain_entitlements.py
          cd apps/mobile
          flutter test --dart-define=SIDEMESH_MACOS_USE_DATA_PROTECTION_KEYCHAIN=true test/host_store_test.dart

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Check browser SQLite migration and pending input
        run: bash scripts/test-flutter-web-storage.sh

      - name: Build Flutter web app
        working-directory: apps/mobile
        run: flutter build web --release -t lib/main_web.dart --no-web-resources-cdn

  storage-platforms:
    name: Storage checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check daemon state and recovery
        run: node --import tsx --test src/session-store.test.ts src/session-history.test.ts src/session-coordinator.test.ts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: python scripts/check_flutter_theme.py
      - name: Check client storage and provider controls
        working-directory: apps/mobile
        run: flutter test test/session_local_store_test.dart test/session_send_outbox_store_test.dart test/session_configuration_controls_test.dart

  web:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check content and types
        run: npm run check

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build
