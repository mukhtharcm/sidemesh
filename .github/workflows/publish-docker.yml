name: Publish Docker Image

on:
  push:
    branches:
      - release

permissions: {}

concurrency:
  group: publish-docker-release
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test server
        run: npm run test:server

      - name: Build package
        run: npm run build

  smoke-test:
    name: Smoke-test container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sidemesh:smoke
          cache-from: type=gha,scope=sidemesh-docker
          cache-to: type=gha,mode=max,scope=sidemesh-docker

      - name: Verify container boot
        shell: bash
        run: |
          container_id="$(
            docker run --detach --rm \
              --env SIDEMESH_PROVIDER=fake \
              --env SIDEMESH_PROVIDERS=fake \
              --env SIDEMESH_TOKEN=docker-smoke-test-token \
              sidemesh:smoke
          )"

          cleanup() {
            docker logs "$container_id" || true
            docker stop "$container_id" || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 1
          done

          echo "Container did not become healthy within 30 seconds." >&2
          exit 1

  publish:
    name: Publish multi-platform image
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=release
            type=sha,prefix=release-
          labels: |
            org.opencontainers.image.title=Sidemesh
            org.opencontainers.image.description=Fleet-first coding-agent session node

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=sidemesh-docker
          cache-to: type=gha,mode=max,scope=sidemesh-docker
          provenance: mode=max
          sbom: true
